name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Verify reproducible build
        shell: bash
        run: |
          python source/build.py
          git diff --exit-code -- dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/create_documents.py
      - run: npm test
      - run: python tests/verify_plain_decode.py
      - run: python tests/verify_code_zip.py
      - run: python tests/verify_documents.py
      - run: python tests/verify_large_files.py
      - name: Attach results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
